name: Build and Test

on:
    workflow_dispatch:
        inputs:
          test-filter:
            default: ""
            description: "Surefire -Dtest selector (empty runs the full unit suite)"
            required: false
          logLevel:
            default: warning
            description: "Log level"
            required: true
          tags:
            description: "Test scenario tags"

concurrency:
  # older builds for the same pull request numer or branch should be cancelled
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 50
        steps:
            - uses: actions/checkout@v1
            - uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '11'
            - name: Build
              shell: bash
              env:
                WHITESOURCE_API_KEY: ${{ secrets.WHITESOURCE_API_KEY }}
              run: |
                if [ -n "${{ inputs.test-filter }}" ]; then
                  mvn clean install --batch-mode --show-version -Dtest=${{ inputs.test-filter }} -Dsurefire.failIfNoSpecifiedTests=false
                else
                  ./ci/build.sh
                fi
            - name: List skipped tests
              if: always()
              shell: bash
              run: |
                grep -H -B1 -A1 "<skipped" target/surefire-reports/*.xml FIPS/target/surefire-reports/*.xml || echo "No skipped tests"
                echo "=== Skip reasons: bare <skipped/> entries come from upstream @Ignore annotations in the test sources ==="
                for f in $(grep -l "<skipped/>" target/surefire-reports/TEST-*.xml 2>/dev/null); do
                  cls=$(basename "$f" .xml); cls=${cls#TEST-}
                  src="src/test/java/$(echo "$cls" | tr . /).java"
                  echo "--- $cls: upstream-disabled via @Ignore in $src:"
                  grep -n -A3 "@Ignore" "$src" || echo "  (no @Ignore found in source)"
                done
            - name: Stage release jars
              shell: bash
              run: |
                mkdir -p seal-artifacts
                cp -p lib/snowflake-jdbc-*.jar seal-artifacts/
                v=$(basename lib/snowflake-jdbc-*.jar .jar); v=${v#snowflake-jdbc-}
                cp -p target/snowflake-jdbc-tests.jar seal-artifacts/snowflake-jdbc-$v-tests.jar
                ls -l seal-artifacts
            - uses: actions/upload-artifact@v4
              with:
                name: snowflake-jdbc-jars
                path: seal-artifacts/*.jar
                if-no-files-found: error

    test-linux:
        needs: build
        name: ${{ matrix.cloud }} JDBC${{ matrix.additionalMavenProfile }} ${{ matrix.category }} on ${{ matrix.image }}
        if: false
        runs-on: ubuntu-latest
        timeout-minutes: 50
        strategy:
            fail-fast: false
            matrix:
                image: [ 'jdbc-centos7-openjdk8', 'jdbc-centos7-openjdk11', 'jdbc-centos7-openjdk17' ]
                cloud: [ 'AWS' ]
                category: ['TestCategoryResultSet,TestCategoryOthers,TestCategoryLoader', 'TestCategoryConnection,TestCategoryStatement', 'TestCategoryArrow,TestCategoryCore', 'TestCategoryFips']
                additionalMavenProfile: ['', '-Dthin-jar']
        steps:
            - uses: actions/checkout@v1
            - name: Tests
              shell: bash
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud }}
                TARGET_DOCKER_TEST_IMAGE: ${{ matrix.image }}
                JDBC_TEST_CATEGORY: ${{ matrix.category }}
                ADDITIONAL_MAVEN_PROFILE: ${{ matrix.additionalMavenProfile }}
              run: ./ci/test.sh

    test-linux-old-driver:
        name: Old JDBC ${{ matrix.category }} on ${{ matrix.image }}
        if: false
        runs-on: ubuntu-latest
        timeout-minutes: 50
        strategy:
            fail-fast: false
            matrix:
                image: [ 'jdbc-centos7-openjdk8' ]
                cloud: [ 'AWS' ]
                category: ['TestCategoryResultSet,TestCategoryOthers', 'TestCategoryConnection,TestCategoryStatement', 'TestCategoryCore,TestCategoryLoader']
                is_old_driver: ['true']
        steps:
            - uses: actions/checkout@v1
            - name: Tests
              shell: bash
              env:
                PARAMETERS_SECRET: ${{ secrets.PARAMETERS_SECRET }}
                CLOUD_PROVIDER: ${{ matrix.cloud }}
                TARGET_DOCKER_TEST_IMAGE: ${{ matrix.image }}
                JDBC_TEST_CATEGORY: ${{ matrix.category }}
                is_old_driver: ${{ matrix.is_old_driver }}
              run: ./ci/test.sh
